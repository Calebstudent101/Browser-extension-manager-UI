<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="project.css">
    <script scr="project.js"></script>
    <title>Frontend Mentor | Browser extensions manager UI</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution { font-size: 0.6875rem; text-align: center; }
      .attribution a { color: hsl(228, 45%, 44%); }
    </style>
  </head>
  <body>
    <div id="extensionsContainer">
      <div id = "extensionsDiv" class="margin-top">
        <img id="logo1" src="assets/images/logo.svg">
      </div>
      <button id="sunContainer">
        <img id="sun" src="assets/images/icon-sun.svg">
      </button>
    </div>

    <div id="extensionsList">
      <h3 id="extensionsColor">Extensions List</h3>
      <div id="nav-buttons-container">
        <button class="nav-buttons">All</button>
        <button class="nav-buttons">Active</button>
        <button class="nav-buttons">Inactive</button>
      </div>
    </div>

    <section class="grid-container">
      <div class="cards">1</div>
      <div class="cards">2</div>
      <div class="cards">3</div>
      <div class="cards">4</div>
      <div class="cards">5</div>
      <div class="cards">6</div>
      <div class="cards">7</div>
      <div class="cards">8</div>
      <div class="cards">9</div>
      <div class="cards">10</div>
      <div class="cards">11</div>
      <div class="cards">12</div>
    </section>

  </body>
  </html>
